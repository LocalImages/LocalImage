name: Release

# Push a tag like v0.2.0 (it must equal the contents of the VERSION file).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release artifacts
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag must match VERSION
        run: |
          if [ "v$(cat VERSION)" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: release # add required reviewers to this environment for a manual approval step
    permissions:
      contents: read
      id-token: write # lets npm record where each package was built (provenance)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Restore executable bits
        # Artifacts do not keep file permissions, so without this the published
        # binaries are not executable (this broke 0.1.0).
        run: chmod +x dist/npm/*-*/bin/localimage*
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Smoke test the packages before publishing
        run: |
          v="${GITHUB_REF_NAME#v}"
          test -x dist/npm/linux-x64/bin/localimage || { echo "binary is not executable"; exit 1; }
          tmp="$(mktemp -d)"
          (cd dist/npm/localimage && npm pack --pack-destination "$tmp")
          (cd dist/npm/linux-x64 && npm pack --pack-destination "$tmp")
          cd "$tmp" && npm init -y >/dev/null
          npm install --omit=optional "./localimage-$v.tgz" "./localimage-linux-x64-$v.tgz"
          test "$(npx --no-install localimage --version)" = "$v"
      - name: Publish platform packages, then the main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Provenance links each package to this workflow run. npm only accepts it for public repositories.
          PROV=""
          if [ "${{ github.event.repository.private }}" = "false" ]; then PROV="--provenance"; fi
          for d in dist/npm/*-*/; do (cd "$d" && npm publish --access public $PROV); done
          (cd dist/npm/localimage && npm publish --access public $PROV)

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # PyPI trusted publishing; no token needed
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/wheels/

  github-release:
    name: GitHub release
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # signs the attestation below
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Collect binaries and checksums
        run: |
          chmod +x dist/bin/*/localimage*
          mkdir release
          for d in dist/bin/*/; do
            name="$(basename "$d")"
            f="$(ls "$d")"
            ext=""; case "$f" in *.exe) ext=".exe";; esac
            cp "$d/$f" "release/localimage-$name$ext"
          done
          # This job has no checkout; the notices travel inside the build artifact.
          cp dist/npm/linux-x64/THIRD_PARTY_NOTICES.md dist/npm/linux-x64/LICENSE release/
          (cd release && sha256sum * > SHA256SUMS)
      - name: Attest the release binaries
        # A signed statement that these exact files were built by this workflow (public repositories).
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: true
