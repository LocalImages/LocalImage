name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by the release workflow so a tag cannot publish untested code

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...

  packages:
    name: Build and validate packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build binaries, npm packages and wheels
        run: python3 scripts/package.py
      - name: Check wheel metadata
        run: |
          python3 -m pip install twine
          twine check dist/wheels/*.whl
      - name: Check npm packages
        run: |
          for d in dist/npm/*/; do (cd "$d" && npm pack --dry-run); done
      - name: Install the built npm packages and run the CLI
        run: |
          v="$(cat VERSION)"
          tmp="$(mktemp -d)"
          (cd dist/npm/localimage && npm pack --pack-destination "$tmp")
          (cd dist/npm/linux-x64 && npm pack --pack-destination "$tmp")
          cd "$tmp" && npm init -y >/dev/null
          npm install --omit=optional "./localimage-$v.tgz" "./localimage-linux-x64-$v.tgz"
          test "$(npx --no-install localimage --version)" = "$v"
      - name: Install the built wheel and run the CLI
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/wheels/*manylinux_2_17_x86_64*.whl
          test "$(/tmp/venv/bin/localimage --version)" = "$(cat VERSION)"

  e2e:
    name: End-to-end (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: go build -o bin/localimage ./cmd/localimage
      - name: Start the daemon
        run: |
          ./bin/localimage doctor || true
          nohup ./bin/localimage start > daemon.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7777/healthz && exit 0
            sleep 1
          done
          echo "daemon did not start"; cat daemon.log; exit 1
      - name: Run end-to-end tests
        working-directory: packages/npm
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm install
          npm run test:types
          npm test
      - name: Run Python SDK end-to-end tests
        working-directory: packages/python
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
      - name: Daemon log
        if: failure()
        run: |
          cat daemon.log
          cat /tmp/localimage-daemon-*.log 2>/dev/null || true
