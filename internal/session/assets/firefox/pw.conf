[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
redirect_stderr=true

[program:pw-server]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",PLAYWRIGHT_BROWSERS_PATH="/opt/pw-browsers"
command=node /opt/pw/server.mjs
directory=/opt/pw
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/pw.log
redirect_stderr=true
